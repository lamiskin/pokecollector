name: Fork Release

# Builds the fork's own images for an immutable `fork-v*` tag and creates the
# GitHub release that pins them by digest.
#
# Upstream's `release.yml` in this fork targets Git-Romer's GHCR namespace and
# reuses upstream images when the revision matches; it cannot produce fork
# images. This workflow is fork-only and must never be sent upstream.
#
# Tag convention: fork-v<upstream-version>-<n>, for example fork-v1.55.1-1.
# Push the tag only once the release commit is frozen on fork/main; see
# docs/FORK_RUNBOOK.md step 6.
#
# workflow_dispatch is a build-only dry run unless `publish` is checked: it
# builds the tag when it already exists, otherwise the selected ref (the
# release branch). A dry run never pushes an image or creates a release.
# Manual dispatch needs this file on the repository's default branch (or a
# previous run); for this fork the default should be fork/main, not the
# upstream `main` mirror.

on:
  push:
    tags:
      - 'fork-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing fork-v* tag to build, for example fork-v1.55.1-1'
        required: true
        type: string
      publish:
        description: 'Push images and publish the GitHub release (unchecked = build-only dry run)'
        required: true
        default: false
        type: boolean

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      app_version: ${{ steps.tag.outputs.app_version }}
      sha: ${{ steps.tag.outputs.sha }}
      upstream_base: ${{ steps.tag.outputs.upstream_base }}
      namespace: ${{ steps.tag.outputs.namespace }}
      publish: ${{ steps.tag.outputs.publish }}
      backend_present: ${{ steps.images.outputs.backend_present }}
      frontend_present: ${{ steps.images.outputs.frontend_present }}
    steps:
      - name: Check out the release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_SHA: ${{ github.sha }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^fork-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::'$tag' is not a fork release tag (fork-v<upstream-version>-<n>)"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            publish=true
          else
            publish="${INPUT_PUBLISH:-false}"
          fi

          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: Basic ${auth_header}")

          if git "${auth[@]}" fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null; then
            if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
              echo "::error::${tag} must be an annotated tag"
              exit 1
            fi
            sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          elif [[ "$EVENT_NAME" == "push" || "$publish" == "true" ]]; then
            echo "::error::${tag} does not exist on the remote"
            exit 1
          else
            # Dry run before the tag is pushed: build the selected ref, which is
            # the release branch the tag will later point at.
            sha="$PUSHED_SHA"
            git "${auth[@]}" fetch --force origin "$sha"
          fi

          if [[ "$EVENT_NAME" == "push" && "$sha" != "$PUSHED_SHA" ]]; then
            echo "::error::${tag} points at ${sha}, not the pushed commit ${PUSHED_SHA}"
            exit 1
          fi
          git checkout --detach "$sha"

          git "${auth[@]}" fetch --force origin \
            "fork/main:refs/remotes/origin/fork/main" \
            "main:refs/remotes/origin/main"

          if [[ "$publish" == "true" ]] && ! git merge-base --is-ancestor "$sha" refs/remotes/origin/fork/main; then
            echo "::error::${sha} is not reachable from fork/main; merge the release commit there first"
            exit 1
          fi

          upstream_base="$(git merge-base "$sha" refs/remotes/origin/main)"

          app_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${tag#fork-v}"
          tag_version="${tag_version%-*}"
          if [[ "$app_version" != "$tag_version" ]]; then
            echo "::error::${tag} names upstream ${tag_version} but VERSION is ${app_version}"
            exit 1
          fi

          if [[ "$publish" == "true" ]] && gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::${tag} is already published; release tags are immutable — cut the next release number"
              exit 1
            fi
            echo "Recovering the existing draft release ${tag}."
          fi

          namespace="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          {
            echo "tag=${tag}"
            echo "version=${tag#fork-v}"
            echo "app_version=${app_version}"
            echo "sha=${sha}"
            echo "upstream_base=${upstream_base}"
            echo "namespace=${namespace}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

          echo "Release ${tag}: fork ${sha}, upstream base ${upstream_base}, publish=${publish}"

      - name: Set up Docker Buildx
        if: steps.tag.outputs.publish == 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reuse images already built from this commit
        id: images
        if: steps.tag.outputs.publish == 'true'
        shell: bash
        env:
          NAMESPACE: ${{ steps.tag.outputs.namespace }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          # buildx may push an image index (multi-platform metadata, provenance)
          # or a single manifest; labels live on the platform manifest either way.
          image_labels() {
            local repo="$1" index_digest="$2" manifest platform_digest labels
            manifest="$(docker buildx imagetools inspect "${repo}@${index_digest}" --format '{{json .Manifest}}' 2>/dev/null || true)"
            platform_digest="$(jq -r 'first(.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest) // empty' <<< "${manifest:-null}" 2>/dev/null || true)"
            labels="$(docker buildx imagetools inspect "${repo}@${platform_digest:-$index_digest}" --format '{{json .Image.Config.Labels}}' 2>/dev/null || true)"
            printf '%s' "${labels:-null}"
          }

          for image in backend frontend; do
            ref="ghcr.io/${NAMESPACE}/pokecollector-${image}:${TAG}"
            inspection="$(docker buildx imagetools inspect "$ref" 2>/dev/null || true)"
            present=false
            if [[ -n "$inspection" ]]; then
              index_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspection")"
              if [[ -z "$index_digest" ]]; then
                echo "::error::could not read the digest of ${ref}"
                exit 1
              fi
              labels="$(image_labels "${ref%:*}" "$index_digest")"
              revision="$(jq -r '."org.opencontainers.image.revision" // empty' <<< "$labels" 2>/dev/null || true)"
              if [[ "$revision" != "$RELEASE_SHA" ]]; then
                echo "::error::${ref} exists but was built from '${revision}', not ${RELEASE_SHA}; cut the next release number"
                exit 1
              fi
              present=true
              echo "Reusing ${ref}; it was built from ${RELEASE_SHA}."
            fi
            echo "${image}_present=${present}" >> "$GITHUB_OUTPUT"
          done

  test:
    name: Release gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: ci-release-password
          POSTGRES_DB: pokemon_tcg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_tcg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: Basic ${auth_header}" \
            fetch --force origin "${RELEASE_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pokemon:ci-release-password@127.0.0.1:5432/pokemon_tcg
        run: python -m unittest discover -s tests

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check version consistency
        # scripts/check-version.mjs also asserts upstream's compose image lines,
        # which the fork's dual-instance compose deliberately replaces.
        run: |
          # shellcheck disable=SC2016  # the JavaScript uses template literals
          node -e '
            const fs = require("node:fs")
            const version = fs.readFileSync("VERSION", "utf8").trim()
            const pkg = JSON.parse(fs.readFileSync("frontend/package.json", "utf8"))
            const lock = JSON.parse(fs.readFileSync("frontend/package-lock.json", "utf8"))
            const problems = []
            if (pkg.version !== version) problems.push(`package.json ${pkg.version}`)
            if (lock.version !== version) problems.push(`package-lock.json ${lock.version}`)
            if (lock.packages?.[""]?.version !== version) problems.push("package-lock root package")
            if (problems.length) {
              console.error(`VERSION ${version} disagrees with ${problems.join(", ")}`)
              process.exit(1)
            }
            console.log(`Version ${version} is consistent.`)
          '

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend checks
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check release tooling
        run: |
          node scripts/check-compose-ports.mjs
          node --test scripts/check-compose-ports.test.mjs scripts/fork-release-manifest.test.mjs

  build:
    name: Build fork images
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: Basic ${auth_header}" \
            fetch --force origin "${RELEASE_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Build backend image
        if: needs.prepare.outputs.publish != 'true' || needs.prepare.outputs.backend_present != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          tags: ghcr.io/${{ needs.prepare.outputs.namespace }}/pokecollector-backend:${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PokéCollector fork backend
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=fork-backend
          cache-to: type=gha,mode=max,scope=fork-backend

      - name: Build frontend image
        if: needs.prepare.outputs.publish != 'true' || needs.prepare.outputs.frontend_present != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          tags: ghcr.io/${{ needs.prepare.outputs.namespace }}/pokecollector-frontend:${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PokéCollector fork frontend
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=fork-frontend
          cache-to: type=gha,mode=max,scope=fork-frontend

      - name: Report the dry-run build
        if: needs.prepare.outputs.publish != 'true'
        run: |
          echo "Dry run: both images were built; nothing was pushed and no release was created."
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep pokecollector

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: Basic ${auth_header}" \
            fetch --force origin "${RELEASE_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Verify anonymous access and resolve digests
        id: verify
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          NAMESPACE: ${{ needs.prepare.outputs.namespace }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          for image in backend frontend; do
            ref="ghcr.io/${NAMESPACE}/pokecollector-${image}:${TAG}"
            inspection="$(docker buildx imagetools inspect "$ref" 2>/dev/null || true)"
            if [[ -z "$inspection" ]]; then
              echo "::error::${ref} is not anonymously readable. Make the GHCR package public once, then rerun."
              exit 1
            fi
            index_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspection")"
            if [[ -z "$index_digest" ]]; then
              echo "::error::could not read the digest of ${ref}"
              exit 1
            fi

            manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null || true)"
            platform_digest="$(jq -r 'first(.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest) // empty' <<< "${manifest:-null}" 2>/dev/null || true)"
            if jq -e 'has("manifests")' <<< "${manifest:-null}" >/dev/null 2>&1 && [[ -z "$platform_digest" ]]; then
              echo "::error::${ref} has no linux/amd64 manifest"
              exit 1
            fi

            labels="$(docker buildx imagetools inspect "${ref%:*}"@"${platform_digest:-$index_digest}" --format '{{json .Image.Config.Labels}}' 2>/dev/null || true)"
            revision="$(jq -r '."org.opencontainers.image.revision" // empty' <<< "${labels:-null}" 2>/dev/null || true)"
            if [[ "$revision" != "$RELEASE_SHA" ]]; then
              echo "::error::${ref} was built from '${revision}', not ${RELEASE_SHA}"
              exit 1
            fi
            echo "${image}_digest=${index_digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Generate release assets
        shell: bash
        env:
          NAMESPACE: ${{ needs.prepare.outputs.namespace }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          UPSTREAM_BASE: ${{ needs.prepare.outputs.upstream_base }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          BACKEND_DIGEST: ${{ steps.verify.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.verify.outputs.frontend_digest }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          args=(
            --tag "$TAG"
            --sha "$RELEASE_SHA"
            --upstream-base "$UPSTREAM_BASE"
            --namespace "$NAMESPACE"
            --repository "$GITHUB_REPOSITORY"
            --platform linux/amd64
            --backend-tests success
            --frontend-tests success
            --workflow-run "$WORKFLOW_RUN"
            --out release-assets
          )
          if [[ "$PUBLISH" == "true" ]]; then
            if [[ -z "$BACKEND_DIGEST" || -z "$FRONTEND_DIGEST" ]]; then
              echo "::error::the verify step did not report both image digests"
              exit 1
            fi
            args+=(--digest-backend "$BACKEND_DIGEST" --digest-frontend "$FRONTEND_DIGEST")
          else
            args+=(--dry-run true)
          fi
          node scripts/fork-release-manifest.mjs "${args[@]}"

      - name: Upload the dry-run assets
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-release-${{ needs.prepare.outputs.tag }}
          path: release-assets/
          retention-days: 14

      - name: Create or reuse the draft release
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Reusing the existing draft release ${TAG}."
          else
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-assets/RELEASE_NOTES.md \
              --target "$RELEASE_SHA"
          fi

      - name: Upload release assets
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            release-assets/release-manifest.json \
            release-assets/pokecollector.env.example \
            release-assets/docker-compose.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest=false \
            --notes-file release-assets/RELEASE_NOTES.md
