server {
    listen 80;
    server_name _;
    client_max_body_size 500M;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://assets.tcgdex.net https://raw.githubusercontent.com https://avatars.githubusercontent.com https://github.com data: blob:; connect-src 'self' https://api.tcgdex.net https://api.frankfurter.app https://api.github.com https://raw.githubusercontent.com https://generativelanguage.googleapis.com" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # OIDC callback carries a one-time authorization code and state in the query
    # string. Never let the native access log retain it, and force no-store /
    # no-referrer on every OIDC redirect/error even if upstream headers are
    # altered. This is a path-only proxy rule (nginx locations ignore the query
    # string), not a rewrite of the callback URL. It also covers start and
    # completion, whose responses are redirects/JSON.
    location ^~ /api/auth/oidc/ {
        access_log off;
        # Upstream errors can otherwise make nginx log the full request URI
        # (including callback code/state). Discard location-scoped error output
        # without touching general server/http error logging.
        error_log /dev/null crit;
        # These endpoints take no request body beyond a tiny JSON/CSRF envelope.
        client_max_body_size 16k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Batch scans can contain up to 200 MiB of image data. Allow a small amount
    # of multipart overhead for that one upload endpoint without raising the
    # limit for every API route.
    location = /api/cards/recognize/jobs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 205M;
    }

    # A scanner configuration test can run two three-attempt capability probes.
    # 1100s covers 6 * the largest 180s response budget plus retry overhead.
    location = /api/settings/scanner/test {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1100s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1100s;
        client_max_body_size 100M;
    }

    # The synchronous recognition endpoint remains available to API clients
    # and the legacy single-card UI. 1000s covers 5 * the largest 180s response
    # budget plus its bounded TCGdex work and retry overhead.
    location = /api/cards/recognize {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1000s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1000s;
        client_max_body_size 100M;
    }

    # Proxy API requests to backend
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
