# Only public card artwork and set logos/symbols may use the shared image cache.
# Product tokens, fingerprints and future image endpoints must stay uncached.
map $uri $image_cache_bypass {
    default 1;
    ~^/api/images/card/[^/]+/(small|large)$ 0;
    ~^/api/images/set/[^/]+/(logo|symbol)$ 0;
}

map $upstream_status $image_cache_response_bypass {
    default 1;
    200 0;
    304 0;
}

# Bounded disk cache for repeated public image requests.
proxy_cache_path /var/cache/nginx/images
    levels=1:2
    keys_zone=image_cache:20m
    max_size=1g
    inactive=1d
    use_temp_path=off;

# The OIDC endpoints carry the backend's stricter Referrer-Policy: no-referrer.
# An empty add_header value is not sent at all, so this keeps a single policy on
# every response (the location must not declare add_header, which would suppress
# the inherited server headers).
map $uri $referrer_policy {
    default "strict-origin-when-cross-origin";
    ~^/api/auth/oidc(/|$) "";
}

# Path-only access record for OIDC endpoints. The callback URL carries a
# one-time authorization code and state in its query string, so these requests
# are logged with the method and path only ($uri never includes the query).
# Every other request keeps the default combined format.
log_format oidc_path_only '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    client_max_body_size 500M;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    # 'wasm-unsafe-eval' and worker-src are added at container start by
    # docker-entrypoint.d/46-configure-detector-csp.sh, and only when the card
    # detector is enabled; the shipped policy stays as strict as upstream.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://assets.tcgdex.net https://raw.githubusercontent.com https://avatars.githubusercontent.com https://github.com data: blob:; connect-src 'self' https://pokecollector.romerg.de https://api.tcgdex.net https://api.frankfurter.app https://api.github.com https://raw.githubusercontent.com https://generativelanguage.googleapis.com" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # OIDC callback carries a one-time authorization code and state in the query
    # string. Keep access logging enabled for these paths, but record them with
    # the path-only oidc_path_only format so the query is never written. This is
    # a path-only proxy rule (nginx locations ignore the query string), not a
    # rewrite of the callback URL. It also covers start and completion, whose
    # responses are redirects/JSON.
    location ^~ /api/auth/oidc/ {
        access_log /var/log/nginx/access.log oidc_path_only;
        # Upstream errors can otherwise make nginx log the full request URI
        # (including callback code/state). Discard location-scoped error output
        # without touching general server/http error logging.
        error_log /dev/null crit;
        # These endpoints take no request body beyond a tiny JSON/CSRF envelope.
        client_max_body_size 16k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        # The backend sets Cache-Control: no-store and Referrer-Policy:
        # no-referrer on every OIDC response; both must reach the browser
        # unchanged (no location-level override hides or replaces them).
        # Inherit all server security headers, including Content-Security-Policy.
        # Do not declare any location-level header here: that would suppress
        # the inherited server headers, including Content-Security-Policy.
        # The backend already sends no-store.
    }

    # Batch scans can contain up to 200 MiB of image data. Allow a small amount
    # of multipart overhead for that one upload endpoint without raising the
    # limit for every API route.
    location = /api/cards/recognize/jobs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 205M;
    }

    # A scanner configuration test can run two three-attempt capability probes.
    # 1900s covers 6 * the largest 300s response budget plus retry overhead.
    location = /api/settings/scanner/test {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1900s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1900s;
        client_max_body_size 100M;
    }

    # The synchronous recognition endpoint remains available to API clients
    # and the legacy single-card UI. 1600s covers 5 * the largest 300s response
    # budget plus its bounded TCGdex work and retry overhead.
    location = /api/cards/recognize {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1600s;
        client_max_body_size 100M;
    }

    # Cache card and set images from backend to avoid redundant multi-hop I/O
    location ^~ /api/images/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;

        proxy_cache image_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # Browser copies revalidate; public backend responses allow a short
        # shared-cache lifetime. Mutable artwork is never treated as immutable.
        proxy_cache_valid 200 60s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale off;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_bypass $image_cache_bypass $http_authorization $http_cookie $arg_retry $http_cache_control $http_pragma;
        proxy_no_cache $image_cache_bypass $image_cache_response_bypass $http_authorization $http_cookie $arg_retry $http_cache_control $http_pragma;

        # Inherit all server security headers, including Content-Security-Policy.
        # Do not add location-level headers that suppress that inheritance.
    }

    # Proxy API requests to backend
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # Service-worker family is never HTTP-cached: updates and the kill switch must propagate.
    # Must stay before the static-asset regex below (first matching regex wins).
    location ~ ^/sw(\.real|\.kill)?\.js$ {
        include /etc/nginx/snippets/pc-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The SPA document names hashed assets that disappear on every frontend
    # rebuild, so a cached copy keeps a browser pointing at files that no
    # longer exist and the app never mounts (blank page). `expires -1` sets
    # Cache-Control without declaring a location-level header, which would
    # suppress the inherited CSP, Permissions-Policy and other security
    # headers the scanner needs.
    location = /index.html {
        expires -1;
    }

    location = /manifest.json {
        include /etc/nginx/snippets/pc-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Card detector assets. nginx's bundled mime.types has no entry for `.mjs`, so
    # the browser refuses to load the ONNX runtime as a module unless the type is
    # declared here. `types` is local to this location, so nothing else changes.
    location ^~ /detector/ {
        types {
            application/javascript mjs;
            application/wasm wasm;
            application/octet-stream onnx;
        }
        expires 7d;
    }

    # Cross-origin-isolated threading lab (static diagnostic, not part of the SPA).
    #
    # Multi-threaded WASM needs SharedArrayBuffer, which browsers only expose to a
    # cross-origin-isolated document. COOP+COEP cannot be set server-wide: COEP
    # require-corp would block third-party card art. They are scoped to this one
    # static page, which is why it lives outside the app's routes.
    #
    # This location declares its own add_header, so it MUST include the security
    # header snippet: a location-level add_header drops every inherited server
    # header, and the page would silently lose its CSP and Permissions-Policy
    # (camera access depends on the latter). Same trap as `location /` and the
    # service-worker locations above.
    #
    # `.js`/`.html` keep the inherited mime.types mapping, so no `types` block is
    # needed here (unlike /detector/, which serves .mjs/.wasm/.onnx).
    #
    # `^~` keeps the regex static-asset location from claiming lab.js and, more
    # importantly, keeps `try_files ... /index.html` from turning this URL into the
    # SPA shell. A missing lab file is a 404, not a login page.
    location ^~ /cv-js-lab/ {
        include /etc/nginx/snippets/pc-security-headers.conf;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # A diagnostic page must never be cached: a stale copy would hide a broken
        # deployment (and stale headers would hide a lost isolation grant).
        expires -1;
        try_files $uri $uri/ =404;
    }

    # SPA routing
    location / {
        include /etc/nginx/snippets/pc-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/pc-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
