<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: without it, Chrome's default is
         to shrink the visual viewport when its address bar (or the on-screen
         keyboard) shows without reflowing layout — so dvh, and a fixed
         inset-0 overlay's own top edge, stay sized against the address-bar-
         retracted viewport and end up partly hidden behind the bar rather
         than resized below it. This makes Chrome actually resize layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Pokemon TCG Collection</title>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/pokeball.svg?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e3000b" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-dark-bg text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
